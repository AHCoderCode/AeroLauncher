name: Import packaged AeroOS source

on:
  push:
    branches: [main]
    paths:
      - 'source-parts/08.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Reconstruct and extract complete project
        shell: pwsh
        run: |
          $partsDir = Join-Path $PWD 'source-parts'
          $partNames = @('00.b64','01.b64','02.b64','03.b64','04.b64','05.b64','06.b64','07.b64','08.b64')
          $encoded = New-Object System.Text.StringBuilder

          foreach ($partName in $partNames) {
            $partPath = Join-Path $partsDir $partName
            if (-not (Test-Path -LiteralPath $partPath -PathType Leaf)) {
              throw "Required source archive segment is missing: $partName"
            }
            [void]$encoded.Append((Get-Content -LiteralPath $partPath -Raw).Trim())
          }

          $bytes = [Convert]::FromBase64String($encoded.ToString())
          $archive = Join-Path $PWD 'AeroOS-Windows-source-v0.1.0.zip'
          [System.IO.File]::WriteAllBytes($archive, $bytes)

          $temp = Join-Path $env:RUNNER_TEMP 'aeroos-source-import'
          if (Test-Path -LiteralPath $temp) {
            throw "Temporary extraction path unexpectedly exists: $temp"
          }

          New-Item -ItemType Directory -Path $temp | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $temp
          $project = Join-Path $temp 'AeroOS-Windows'
          if (-not (Test-Path -LiteralPath $project -PathType Container)) {
            throw 'The source archive does not contain the expected project folder.'
          }

          Copy-Item -Path (Join-Path $project '*') -Destination $PWD -Recurse -Force
          Remove-Item -LiteralPath $partsDir -Recurse -Force
          Write-Host 'The complete AeroOS source tree was extracted into the repository.'

      - name: Commit imported source tree
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'No source-tree changes were needed.'
            exit 0
          }
          git commit -m 'Import complete AeroOS Windows Edition source tree'
          git push
