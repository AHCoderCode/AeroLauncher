name: Import, build and package AeroOS Windows Edition

on:
  push:
    branches: [main]
    paths:
      - 'AeroOS-Windows-source-v0.1.0.zip'
      - '.build-request'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract complete project tree
        shell: pwsh
        run: |
          $archive = Join-Path $PWD 'AeroOS-Windows-source-v0.1.0.zip'
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw 'Source archive is missing; no repository source files were changed.'
          }

          $temp = Join-Path $env:RUNNER_TEMP 'aeroos-source-import'
          if (Test-Path -LiteralPath $temp) {
            throw "Temporary extraction path unexpectedly exists: $temp"
          }

          New-Item -ItemType Directory -Path $temp | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $temp
          $project = Join-Path $temp 'AeroOS-Windows'
          if (-not (Test-Path -LiteralPath $project -PathType Container)) {
            throw 'The archive does not contain the expected AeroOS-Windows project folder.'
          }

          Get-ChildItem -LiteralPath $project -Force |
            Where-Object { $_.Name -ne '.github' } |
            ForEach-Object {
              Copy-Item -LiteralPath $_.FullName -Destination $PWD -Recurse -Force
            }
          Write-Host 'Application source tree extracted. Existing repository workflows are preserved and managed separately.'

      - name: Correct MSBuild solution platform argument
        shell: pwsh
        run: |
          $buildScriptPath = Join-Path $PWD 'scripts/Build-Release.ps1'
          if (-not (Test-Path -LiteralPath $buildScriptPath -PathType Leaf)) {
            throw 'Build-Release.ps1 is missing after source extraction.'
          }

          $buildScript = Get-Content -LiteralPath $buildScriptPath -Raw
          $badArgument = " '/p:Platform=`"Any CPU`"'"
          $fixedArgument = " '/p:Platform=Any CPU'"
          $occurrences = ([regex]::Matches($buildScript, [regex]::Escape($badArgument))).Count

          if ($occurrences -eq 2) {
            $buildScript = $buildScript.Replace($badArgument, $fixedArgument)
            Set-Content -LiteralPath $buildScriptPath -Value $buildScript -Encoding utf8
            Write-Host 'Corrected the Platform property in both MSBuild calls without embedding literal quotes.'
          }
          elseif ($occurrences -eq 0 -and $buildScript.Contains($fixedArgument.TrimStart())) {
            Write-Host 'The platform argument is already corrected.'
          }
          else {
            throw "Expected exactly two malformed platform arguments or an already-corrected argument; found $occurrences. Stopping rather than making an uncertain edit."
          }

          if ($buildScript.Contains('/p:Platform="Any CPU"')) {
            throw 'The malformed quoted Platform argument is still present.'
          }

      - name: Fix WPF compile references and card containers
        shell: pwsh
        run: |
          $projectPath = Join-Path $PWD 'src/AeroOS.Windows/AeroOS.Windows.csproj'
          if (-not (Test-Path -LiteralPath $projectPath -PathType Leaf)) {
            throw 'AeroOS.Windows.csproj is missing after extraction.'
          }

          $project = Get-Content -LiteralPath $projectPath -Raw
          $xmlAnchor = '<Reference Include="System.Runtime.Serialization" />'
          if (-not $project.Contains($xmlAnchor)) {
            throw 'Could not find the expected assembly-reference insertion point.'
          }
          if (-not $project.Contains('<Reference Include="System.Xml" />')) {
            $project = $project.Replace($xmlAnchor, $xmlAnchor + [Environment]::NewLine + '    <Reference Include="System.Xml" />')
            Set-Content -LiteralPath $projectPath -Value $project -Encoding utf8
          }

          $codePath = Join-Path $PWD 'src/AeroOS.Windows/MainWindow.xaml.cs'
          if (-not (Test-Path -LiteralPath $codePath -PathType Leaf)) {
            throw 'MainWindow.xaml.cs is missing after extraction.'
          }

          $code = Get-Content -LiteralPath $codePath -Raw
          $cardFixes = @(
            @{ Old = 'themeCard.Children.Add('; New = '((StackPanel)themeCard.Child).Children.Add('; Count = 3 },
            @{ Old = 'performanceCard.Children.Add('; New = '((StackPanel)performanceCard.Child).Children.Add('; Count = 1 },
            @{ Old = 'wallpaperCard.Children.Add('; New = '((StackPanel)wallpaperCard.Child).Children.Add('; Count = 2 },
            @{ Old = 'resetCard.Children.Add('; New = '((StackPanel)resetCard.Child).Children.Add('; Count = 1 }
          )

          foreach ($fix in $cardFixes) {
            $count = ([regex]::Matches($code, [regex]::Escape($fix.Old))).Count
            if ($count -eq $fix.Count) {
              $code = $code.Replace($fix.Old, $fix.New)
            }
            elseif ($count -ne 0) {
              throw "Unexpected number of '$($fix.Old)' occurrences: $count"
            }
          }

          if ($code.Contains('themeCard.Children.Add(') -or
              $code.Contains('performanceCard.Children.Add(') -or
              $code.Contains('wallpaperCard.Children.Add(') -or
              $code.Contains('resetCard.Children.Add(')) {
            throw 'A Border.Children compile error pattern remains in MainWindow.xaml.cs.'
          }

          Set-Content -LiteralPath $codePath -Value $code -Encoding utf8
          Write-Host 'Added System.Xml reference and routed card content through each Border.Child StackPanel.'

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Verify source safety and required project files
        shell: pwsh
        run: .\scripts\Verify-Source.ps1

      - name: Build and create user-install bundle
        shell: pwsh
        run: .\scripts\Build-Release.ps1

      - name: Commit imported source tree
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if (Test-Path -LiteralPath '.build-request') { Remove-Item -LiteralPath '.build-request' -Force }
          git add --all
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'Import AeroOS Windows Edition source tree'
            git push
          } else {
            Write-Host 'Source tree already matches this repository.'
          }

      - name: Upload portable installation bundle
        uses: actions/upload-artifact@v4
        with:
          name: AeroOS-Windows-v0.1.0
          path: artifacts/AeroOS-Windows-v0.1.0.zip
          if-no-files-found: error
          retention-days: 14
